<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greeting Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background-color: transparent;
    }

    .card {
      padding: 1rem 2rem;
      border-radius: 12px;
      background: #191919;
      color: white;
      display: inline-block;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .greeting {
      font-size: 2.5em;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .date {
      font-size: 1.25em;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .clock {
      font-size: 1.25em;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="greeting" id="greet">Good Day</div>
    <div class="date" id="date">Loading date...</div>
    <div class="clock" id="clock">00:00:00</div>
  </div>

  <script>
    function updateWidget() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      // Greeting
      let greeting = "";
      if (hours < 12) greeting = "Good Morning";
      else if (hours < 18) greeting = "Good Afternoon";
      else greeting = "Good Evening";

      document.getElementById('greet').textContent = greeting;

      // Date
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString(undefined, options);

      // Clock
      const format = (n) => n.toString().padStart(2, '0');
      document.getElementById('clock').textContent = `${format(hours)}:${format(minutes)}:${format(seconds)}`;
    }

    setInterval(updateWidget, 1000);
    updateWidget();
  </script>
</body>
</html>
